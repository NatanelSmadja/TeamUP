<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f2ed" />
    <script>
      (() => {
        const saved = localStorage.getItem('teamup_theme');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#15121f' : '#f5f2ed';
      })();
    </script>
    <meta name="description" content="ניהול משחקי כדורגל לחברים" />
    <meta name="application-name" content="TEAMUP" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TEAMUP" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/teamup-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/teamup-favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TeamUP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
